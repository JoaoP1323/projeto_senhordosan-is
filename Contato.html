        <h2 class="titulo_secundario">Entre em contanto</h2>
        <form action="processa.php" method="POST" autocomplete="off">
            <label>Nome:</label>
            <input type="text" name="nomepessoa"
            id="nomepessoa" minlength="3" maxlength="15" required
            placeholder="Informe seu nome"><br><br>
             
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required
        placeholder="E-mail"><br><br>

        <label for="ano">Ano de Nascimento</label>
        <input type="number" id="ano" name="ano" max="2026" min="1900"
        placeholder="Informe ano de nascimento"><br><br>

        <label for="telefone">Telefone</label>
        <input type="tel" name="telefone" id="telefone"
        placeholder="Informe seu telefone"><br><br>

        <label for="github">Informe seu github</label>
        <input type="url" name="github" id="github"
        placeholder="Informe seu github"><br><br>

        <label for="senha">Informe sua senha</label>
        <input type="password" id="senha" name="senha"><br><br>

        <label for="arquivo">Anexe um arquivo:</label>
        <input type="file" id="arquivo" name="arquivo"><br><br>

        <label for="cor">Escolha uma cor:</label>
        <input type="color" id="cor" name="cor"><br><br>

    <fieldset>
        <legend>Campos de tempo</legend>
        <label for="data">Informe a data:</label>
        <input type="date" name="data" id="data"><br><br>

        <label for="mês">Informe o mês:</label>
        <input type="month" name="mês" id="mês"><br><br>

        <label for="semana">Informe a semana:</label>
        <input type="week" name="semana" id="semana"><br><br>

        <label for="hora">Informe a hora:</label>
        <input type="time" name="hora" id="hora"><br><br>

        <label for="datahora">Data e hora atual</label>
        <input type="datetime-local" name="datahora" id="datahora"><br><br>
    </fieldset>


            <label for="pesquisa">Pesquisa</label>
            <input type="search" id="pesquisa" name="pesquisa"><br><br>

            <label for="descrição">Informe aqui o que você gosta nos filmes:</label><br>
            <textarea cols="30" rows="10" name="descrição" id="descrição"></textarea><br><br>
<fieldset>
            <label for="filme1">Filme 1<input type="radio" name="filme" id="filme1" value="Filme 1"></label>

            <label for="filme2">Filme 2<input checked type="radio" name="filme" id="filme2" value="Filme 2"></label>

            <label for="filme3">Filme 3<input type="radio" name="filme" id="filme3" value="Filme 3"></label>
</fieldset>


<select>
    <option value="filme 1">Filme 1</option>
    <option value="filme 2">Filme 2</option>
    <option selected value="filme 3">Filme 3</option>
</select>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>          

        </form>
</body>
</html>
